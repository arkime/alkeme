[package]
name = "alkeme"
version = "0.2.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "cookies", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
urlencoding = "2.1.3"
digest_auth = "0.3.1"
rpassword = "7.4.0"
clap = { version = "4.5.57", features = ["derive"] }
chrono = "0.4.43"
regex = "1"
futures-util = "0.3.32"
scraper = "0.25.0"
