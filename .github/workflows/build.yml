name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: redhat/ubi9:latest
    steps:
      - name: Install dependencies
        run: |
          dnf install -y gcc make

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build release
        run: |
          source $HOME/.cargo/env
          cargo build --release
          cp target/release/alkeme target/release/alkeme-linux-x86_64

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@69320dbe05506a9a39fc8ae11030b214ec2d1f87
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            target/release/alkeme-linux-x86_64
          body: |
            Alkeme - The Arkime TUI

            Download the binary and run it with: `./alkeme-linux-x86_64 {VIEWER_URL}` see `./alkeme-linux-x86_64 --help` and https://github.com/arkime/alkeme for more info.
