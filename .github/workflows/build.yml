name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-latest
    container:
      image: redhat/ubi9:latest
    steps:
      - name: Install dependencies
        run: |
          dnf install -y gcc make

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build release
        run: |
          source $HOME/.cargo/env
          cargo build --release
          cp target/release/alkeme target/release/alkeme-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alkeme-linux-x86_64
          path: target/release/alkeme-linux-x86_64

  build-linux-arm:
    runs-on: ubuntu-24.04-arm
    container:
      image: redhat/ubi9:latest
    steps:
      - name: Install dependencies
        run: |
          dnf install -y gcc make

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build release
        run: |
          source $HOME/.cargo/env
          cargo build --release
          cp target/release/alkeme target/release/alkeme-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alkeme-linux-arm64
          path: target/release/alkeme-linux-arm64

  build-macos-arm:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build release
        run: |
          source $HOME/.cargo/env
          cargo build --release
          cp target/release/alkeme target/release/alkeme-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alkeme-macos-arm64
          path: target/release/alkeme-macos-arm64

  build-freebsd-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          run: |
            pkg install -y curl gcc
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            . $HOME/.cargo/env
            cargo build --release
            cp target/release/alkeme target/release/alkeme-freebsd-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alkeme-freebsd-x86_64
          path: target/release/alkeme-freebsd-x86_64

  release:
    needs: [build-linux-x86_64, build-linux-arm, build-macos-arm, build-freebsd-x86_64]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@69320dbe05506a9a39fc8ae11030b214ec2d1f87
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/alkeme-linux-x86_64
            artifacts/alkeme-linux-arm64
            artifacts/alkeme-macos-arm64
            artifacts/alkeme-freebsd-x86_64
          body: |
            Alkeme - The Arkime TUI

            After downloading, make the binary executable:
            ```
            chmod a+x alkeme-*
            ```

            On macOS, you also need to remove the quarantine attribute:
            ```
            xattr -d com.apple.quarantine alkeme-macos-arm64
            ```

            Then run it with: `./alkeme-{platform} {VIEWER_URL}`
            See `--help` and https://github.com/arkime/alkeme for more info.

            Alkeme works best with Arkime 6+
